name: Checks

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ${{ github.run_id }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: '3306'
      MYSQL_USER: root
      MYSQL_PASSWORD: ${{ github.run_id }}
      MYSQL_PWD: ${{ github.run_id }}
      MYSQL_PRELUDE_DB: prelude_test
      MYSQL_PREBETTER_DB: prebetter_test
      BETTER_AUTH_URL: http://127.0.0.1:43017
      NUXT_API_BASE: http://127.0.0.1:8000
      ENVIRONMENT: test
      LOG_LEVEL: WARNING
      BACKEND_CORS_ORIGINS: '["http://127.0.0.1:43017"]'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@v10
        with:
          version: '0.12.5'
          python-version: '3.13'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.1'
      - name: Prepare disposable databases
        env:
          DATABASE_CONTAINER: ${{ job.services.mariadb.id }}
        run: |
          docker exec -e MYSQL_PWD "$DATABASE_CONTAINER" mariadb -uroot -e 'CREATE DATABASE prelude_test; CREATE DATABASE prebetter_test;'
          docker exec -i -e MYSQL_PWD "$DATABASE_CONTAINER" mariadb -uroot prelude_test < backend/prelude_structure.sql
          docker exec -i -e MYSQL_PWD "$DATABASE_CONTAINER" mariadb -uroot prebetter_test < frontend/better-auth-schema.sql
          printf 'BETTER_AUTH_SECRET=%s\n' "$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --locked
      - name: Check backend
        working-directory: backend
        run: |
          uv run ruff check .
          uv run pytest
      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Check frontend
        working-directory: frontend
        run: |
          bun run test
          bun run typecheck
          bun run test:e2e
          bun run build
