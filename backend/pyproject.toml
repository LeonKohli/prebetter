[project]
name = "backend"
version = "0.1.0"
description = "Prelude Backend"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[all]>=0.136.3",
    "uvicorn[standard]>=0.49.0",
    "sqlalchemy>=2.0.50",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "pymysql>=1.2.0",
    "bcrypt>=5.0.0",
    "pyjwt>=2.13.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.17",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff.lint.per-file-ignores]
# Ignore E402 (module level import not at top of file) in test fixtures
# This is necessary because conftest.py must load environment variables before imports
"tests/conftest.py" = ["E402"]
